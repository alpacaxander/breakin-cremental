<!doctype html><meta charset="utf-8"><title>BreakIn cremental audio</title>
<style>
body{background:#14151c;color:#e6e8ef;font:14px/1.4 ui-monospace,monospace;margin:0;padding:16px 24px;max-width:960px}
h1{font-size:20px}h2{font-size:15px;margin:24px 0 8px;border-bottom:1px solid #3a3d4d}
.row{display:flex;align-items:center;gap:8px;padding:3px 0}
button{background:#2a2c38;color:#e6e8ef;border:1px solid #4a4e62;border-radius:3px;padding:3px 10px;cursor:pointer;font:inherit}
button:hover{background:#4a4e62}button.on{background:#2f7d8c}
.name{width:150px}.desc{flex:1;color:#9a9eb2}.ms{width:60px;text-align:right;color:#6b7086}p{color:#9a9eb2}
</style>
<h1>BreakIn cremental: audio cues</h1>
<p>Generated by <code>assets/audio/gen.mjs</code>, played by <code>src/autoload/sfx.gd</code>. Judge them by ear here. The music button toggles the loop.</p>
<p>Scenes: <button onclick="combo()">combo climb (brick_break)</button> <button onclick="burst()">64 breaks in one frame, capped and staggered</button></p>
<div id="list"></div>
<script>
const M={"paddle_hit":{"g":"Ball and paddle","d":"ball bounces off the paddle","ms":70,"loop":false},"wall_bounce":{"g":"Ball and paddle","d":"ball bounces off a wall or a Wall Segment","ms":40,"loop":false},"ball_lost":{"g":"Ball and paddle","d":"a ball leaves through the open side (big)","ms":450,"loop":false},"brick_hit":{"g":"Bricks","d":"a brick takes a hit and stays","ms":35,"loop":false},"brick_break":{"g":"Bricks","d":"a brick breaks; the game climbs a pentatonic scale per combo step","ms":60,"loop":false},"gold_brick":{"g":"Bricks","d":"a gold brick breaks","ms":230,"loop":false},"hourglass_brick":{"g":"Bricks","d":"an hourglass brick breaks, time is added","ms":260,"loop":false},"bumper":{"g":"Placeables","d":"ball bounces off a Bumper","ms":60,"loop":false},"booster":{"g":"Placeables","d":"ball passes a Booster and speeds up","ms":120,"loop":false},"splitter":{"g":"Placeables","d":"a new ball: a Splitter's or the Multiball volley's; also a Power Brick breaking","ms":140,"loop":false},"catch":{"g":"Abilities","d":"the paddle catches a drop: one more charge","ms":145,"loop":false},"zap":{"g":"Abilities","d":"a Zap goes off along its row","ms":140,"loop":false},"explosion":{"g":"Abilities","d":"a Blast goes off (big)","ms":500,"loop":false},"round_start":{"g":"Round","d":"Start is pressed, the ball launches","ms":280,"loop":false},"low_timer_tick":{"g":"Round","d":"each whole second at or under the low-time mark","ms":40,"loop":false},"level_cleared":{"g":"Round","d":"every brick is broken (big)","ms":560,"loop":false},"tally_tick":{"g":"Round","d":"the summary counts up","ms":8,"loop":false},"click":{"g":"UI","d":"any button press (Sfx plays it)","ms":40,"loop":false},"buy":{"g":"UI","d":"an upgrade is bought","ms":280,"loop":false},"cant_afford":{"g":"UI","d":"Buy is pressed without the coins","ms":200,"loop":false},"place_item":{"g":"UI","d":"an item is put down in Setup","ms":40,"loop":false},"music":{"g":"Music","d":"the placeholder loop, on the Music bus, quieter than the sounds","ms":25600,"loop":true}}, CLIMB=[1,1.122462048309373,1.2599210498948732,1.4983070768766815,1.681792830507429,2,2.244924096618746,2.5198420997897464,2.996614153753363,3.363585661014858,4], VOICES=4, STAGGER=15;
const loops={};
function play(n,rate=1){const a=new Audio('wav/'+n+'.wav');a.preservesPitch=false;a.playbackRate=rate;a.play();return a}
function toggle(n,b){if(loops[n]){loops[n].pause();delete loops[n];b.classList.remove('on')}else{const a=play(n);a.loop=true;loops[n]=a;b.classList.add('on')}}
function combo(){CLIMB.concat([CLIMB[10],CLIMB[10]]).forEach((r,i)=>setTimeout(()=>play('brick_break',r),i*140))}
function burst(){play('zap');for(let i=0;i<VOICES;i++)setTimeout(()=>play('brick_break'),i*STAGGER)}
const list=document.getElementById('list');let g='';
for(const [n,m] of Object.entries(M)){
 if(m.g!==g){g=m.g;const h=document.createElement('h2');h.textContent=g;list.appendChild(h)}
 const r=document.createElement('div');r.className='row';
 r.innerHTML='<button>&#9654;</button><span class="name">'+n+'</span><span class="desc">'+m.d+'</span><span class="ms">'+m.ms+' ms</span>';
 const b=r.querySelector('button');b.onclick=()=>m.loop?toggle(n,b):play(n);
 list.appendChild(r);
}
</script>
